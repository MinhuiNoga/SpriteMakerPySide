name: SpriteMakerPySide CI

on:
  push:
    branches: ["4.0.1"]
  pull_request:
    branches: ["main", "4.0.1"]

concurrency:
  group: sprite-maker-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-tests:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Compile Python sources
        run: python -m compileall -q sprite_maker tests run.py
      - name: Run unit and integration tests
        run: python -m unittest discover -s tests -v

  windows-package:
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install Python dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Compile Python sources
        shell: pwsh
        run: python -m compileall -q sprite_maker tests run.py
      - name: Run unit and integration tests
        shell: pwsh
        run: python -m unittest discover -s tests -v
      - name: Build Windows package
        shell: pwsh
        run: ./build_exe.ps1
      - name: Verify versioned package
        shell: pwsh
        run: |
          if (-not (Test-Path -LiteralPath "SpriteMakerPySide-4.0.1-win64.zip" -PathType Leaf)) {
            throw "Expected SpriteMakerPySide-4.0.1-win64.zip was not created."
          }
      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: SpriteMakerPySide-4.0.1-win64
          path: SpriteMakerPySide-4.0.1-win64.zip
          if-no-files-found: error
